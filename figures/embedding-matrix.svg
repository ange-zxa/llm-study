<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 330" width="940" height="330" role="img"><defs><style>.t{font:16px 'PingFang SC','Microsoft YaHei',Arial,sans-serif;fill:#172033}.s{font:13px 'PingFang SC','Microsoft YaHei',Arial,sans-serif;fill:#667085}.h{font:bold 20px 'PingFang SC','Microsoft YaHei',Arial,sans-serif;fill:#172033}.a{stroke:#94a3b8;stroke-width:2.3;fill:none;marker-end:url(#arrow)}</style><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6" fill="#94a3b8"/></marker></defs><rect width="940" height="330" fill="#fbfdff"/>
<text class="h" x="26" y="39">一句摘要如何对应矩阵的一行？</text>
<rect x="28" y="76" width="308" height="170" rx="14" fill="#eff6ff" stroke="#bfdbfe"/><text class="t" x="48" y="111" font-weight="bold">论文摘要（1篇）</text><text class="s" x="48" y="146">研究大语言模型在</text><text class="s" x="48" y="175">机器翻译中的应用。</text>
<path class="a" d="M341 164H408"/>
<rect x="419" y="105" width="156" height="106" rx="13" fill="#ddd6fe" stroke="#c4b5fd"/><text class="t" x="449" y="149" font-weight="bold">gte-small</text><text class="s" x="452" y="177">嵌入模型</text>
<path class="a" d="M581 164H640"/>
<rect x="649" y="74" width="265" height="174" rx="13" fill="#ecfdf5" stroke="#bbf7d0"/>
<text class="t" x="669" y="106" font-weight="bold">384维向量（示意）</text>
<text class="s" x="671" y="141">[0.21, -0.47, 0.62, ...]</text><text class="s" x="671" y="175">每篇摘要 → 1行</text><text class="s" x="671" y="209">44,949篇 → 44,949行</text>
<text class="s" x="28" y="285">最终矩阵 shape = (44949, 384)。384不是词语数量，而是嵌入特征维度。</text></svg>